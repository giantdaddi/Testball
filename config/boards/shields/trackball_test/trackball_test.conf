# Mouse / pointer support
CONFIG_ZMK_POINTING=y

# Sensor driver
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610_ALT=y

# The nice!nano switches its VCC pin on at boot. Wait a second so the
# sensor has power before the driver talks to it (avoids "product id 0xFF").
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Uncomment both lines to see sensor debug messages over USB
# (read them with a serial monitor if the cursor doesn't move)
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
